name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  self-test:
    name: 게이트 자체 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 두 파서 경로를 모두 검증한다
        # 게이트는 PyYAML 이 있으면 쓰고 없으면 자체 파서로 떨어진다. 자체 파서가 `>-` 접기나
        # 여러 줄 인용을 못 읽으면 인덱스 비용이 99% 과소평가된다. yaml 이 있는 상태로 돌리면
        # fallback 경로는 한 번도 실행되지 않으므로, 테스트가 직접 두 경로를 다 돌린다
        # (run_gate_no_yaml). 여기서는 대조용으로 PyYAML 을 설치해 둔다.
        run: |
          python -m pip install --quiet pyyaml
          python tests/test_gates.py

  date-bomb:
    name: 날짜 폭탄 검사 (이 레포)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 이 레포의 테스트 픽스처
        # tests/test_gates.py 는 일부러 위반 날짜를 담고 있는 (게이트 자체 테스트) 파일이라 제외한다.
        run: python gates/date_bomb.py . --since 2026-07-31 --allow-file tests/test_gates.py
